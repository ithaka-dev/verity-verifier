# cargo-audit configuration.
#
# Ignoring an advisory in a security-critical crate is a decision, not housekeeping. Each entry
# below must state why the advisory does not apply *to this crate's usage*, and carry a review
# trigger — an ignore with no expiry is how a real vulnerability gets inherited silently.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack: RSA key recovery via timing sidechannel.
    #
    # Reached transitively: verity-verifier → dcap-qvl → dcap-qvl-webpki → rsa 0.9.10.
    # No fixed upgrade exists upstream.
    #
    # WHY IT DOES NOT APPLY HERE:
    # The attack requires the victim to perform RSA *private-key* operations (decryption or
    # signing) whose timing an attacker can observe. This crate performs neither:
    #   - it holds no private keys of any kind, and performs no signing or decryption;
    #   - Intel DCAP quote signatures are ECDSA P-256, not RSA;
    #   - rsa is present only via webpki for X.509 chain validation, which is public-key
    #     verification — the operation the attack does not target.
    #
    # REVIEW TRIGGER: revisit if this crate ever gains a signing or decryption path, or if
    # dcap-qvl publishes a release that drops or replaces the rsa dependency. Whichever comes
    # first — this is not a permanent exemption.
    "RUSTSEC-2023-0071",
]
