name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-features

  fetch:
    name: fetch (against a real IPFS node)
    runs-on: ubuntu-latest
    services:
      # These tests must actually run in CI, not skip. A quietly skipped fetch test is
      # indistinguishable from a passing one, which is how a broken retrieval path ships green.
      ipfs:
        # Digest resolved from the registry for v0.42.0, not hand-written. A fabricated digest is
        # how this job failed the first time -- and pinning by digest is only a guarantee if the
        # digest came from the registry rather than from a person.
        image: ipfs/kubo@sha256:8907cb0cc1ad5798f6bb1bb1341a800990c268e021cedfa317e8aa1a33864214
        ports:
          - 5001:5001
          - 8080:8080
    env:
      IPFS_API: http://127.0.0.1:5001
      IPFS_GATEWAY: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install ipfs cli
        run: |
          curl -fsSL https://dist.ipfs.tech/kubo/v0.42.0/kubo_v0.42.0_linux-amd64.tar.gz | tar -xz
          sudo install kubo/ipfs /usr/local/bin/ipfs
          ipfs --version
      - run: cargo test --features fetch --test compose_fetch -- --nocapture

  wasm:
    name: wasm32 target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The crate claims wasm32 support. A claim nothing builds is aspiration, so it is built here.
      - run: cargo build -p verity-verifier-wasm --target wasm32-unknown-unknown
      # The core must also build without `attest`, since that is what makes the target reachable.
      - run: cargo build -p verity-verifier --no-default-features

  no-dangerous-attestation:
    name: TCB enforcement is not overridable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ADR 0014: TCB status enforcement is mandatory and not configurable. dcap-qvl ships both a
      # `danger-allow-tcb-override` feature and a `dangerous_verify_with_tcb_override` function.
      # A flag that turns a security check off is the flag someone eventually leaves off, so their
      # absence is asserted rather than assumed.
      - name: no danger-allow-tcb-override feature
        run: |
          if cargo tree -e features --all-features | grep -q "danger-allow-tcb-override"; then
            echo "::error::danger-allow-tcb-override is enabled; ADR 0014 forbids it"; exit 1
          fi
      - name: no dangerous_verify_with_tcb_override call
        run: |
          if grep -rn "dangerous_verify_with_tcb_override" crates/ 2>/dev/null; then
            echo "::error::TCB override API is called; ADR 0014 forbids it"; exit 1
          fi

  supply-chain:
    name: audit · deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # This repo does not commit Cargo.lock -- it is a library, and the handbook says not to.
      # cargo-audit needs one, so it is generated here rather than tracked.
      - name: generate lockfile
        run: cargo generate-lockfile
      # Run the binary directly rather than via rustsec/audit-check: the action does not read
      # .cargo/audit.toml, and the documented RUSTSEC-2023-0071 exception lives there. An audit that
      # ignored our reasoning would either fail always or need the exception duplicated.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
