name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `-D warnings`, which this step was missing. `clippy::all` is denied in the workspace
      # manifest and would have failed the build anyway — but `unwrap_used`, `expect_used`, `panic`
      # and `indexing_slicing` are set to `warn`, and those are the ones that exist to keep this
      # crate from panicking. Without the flag they were advisory in CI: a `.unwrap()` on
      # attacker-influenced bytes would have warned and passed.
      #
      # ADR 0014's reasoning is why that matters here specifically — a verifier that panics gets
      # wrapped in catch-and-continue by whoever embeds it, which arrives at the same place as
      # loosening a check.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  # T-18. Coverage was never measured in CI here at all: every number quoted for this crate came
  # from somebody's laptop, so nothing would have noticed it sliding from 90% back to 70%.
  #
  # Floors sit just below current, so a regression trips them and an honest commit does not have to
  # argue with the gate. **Raise them as coverage improves; never lower one to make a build pass.**
  # If a change genuinely justifies a lower floor, that belongs in the commit message where a
  # reviewer sees it.
  #
  # `--fail-under-file-lines` is the one that matters most here, and it is not redundant with the
  # total. A total hides exactly the failure this project has already had: a module going dark while
  # the average stays healthy. Three modules in the template sat fully untested behind a 98% that
  # way. A per-file floor also means a *new* module cannot arrive with no tests at all.
  #
  # 60 is low, and honestly so: `attest.rs` sits at 63% because `Attested`'s accessors are reachable
  # only through `verify_quote`, which needs live Intel collateral. That is correct design — a
  # proof-carrying type should not have a public constructor — so the floor reflects it rather than
  # the type being weakened to raise a number.
  coverage:
    name: coverage floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: |
          cargo llvm-cov --all-features --summary-only \
            --fail-under-lines 89 \
            --fail-under-functions 88 \
            --fail-under-file-lines 60

  # Coverage cannot tell an assertion from a bystander. `verity-contracts` has the receipt — its
  # invariant suite once scored 2 of 12 while coverage looked healthy — and the stakes are higher
  # here: a weakened contract is visible on chain and replaceable, a weakened verifier ships inside
  # every agent and by ADR 0014 is less patchable than the app template.
  #
  # A surviving mutant fails the build. So does a mutant that cannot be applied, because a mutant
  # silently absent leaves the score looking complete while a behaviour went unchecked. And the
  # baseline is proved green before any mutant is scored — without that check every mutant "dies"
  # for free, which is exactly how the contracts harness came to report 15/15 having run no tests.
  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./script/mutate.sh

  fetch:
    name: fetch (against a real IPFS node)
    runs-on: ubuntu-latest
    services:
      # These tests must actually run in CI, not skip. A quietly skipped fetch test is
      # indistinguishable from a passing one, which is how a broken retrieval path ships green.
      ipfs:
        # Digest resolved from the registry for v0.42.0, not hand-written. A fabricated digest is
        # how this job failed the first time -- and pinning by digest is only a guarantee if the
        # digest came from the registry rather than from a person.
        image: ipfs/kubo@sha256:8907cb0cc1ad5798f6bb1bb1341a800990c268e021cedfa317e8aa1a33864214
        ports:
          - 5001:5001
          - 8080:8080
    env:
      IPFS_API: http://127.0.0.1:5001
      IPFS_GATEWAY: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install ipfs cli
        run: |
          curl -fsSL https://dist.ipfs.tech/kubo/v0.42.0/kubo_v0.42.0_linux-amd64.tar.gz | tar -xz
          sudo install kubo/ipfs /usr/local/bin/ipfs
          ipfs --version
          # The CLI is a client of the service container, not a second node. Without this it looks
          # for a local repo that does not exist, and every publish fails.
          ipfs init --profile server
      - run: cargo test --features fetch --test compose_fetch -- --nocapture

  wasm:
    name: wasm32 target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins the toolchain and overrides the action's `targets:`, so the wasm32
      # standard library must be added against the pinned toolchain rather than the action's.
      - run: rustup target add wasm32-unknown-unknown
      # The crate claims wasm32 support. A claim nothing builds is aspiration, so it is built here.
      #
      # **Never add `--all-features` to this line.** The `connect` feature opens a TCP socket, so it
      # carries a `compile_error!` for wasm32 — a deliberate, narrow exception to Cargo's additivity
      # rule over a combination that could not link anyway (`ring` has no backend for that target).
      # The job builds the wasm crate specifically, which depends on the core with
      # `default-features = false` and enables nothing, so nothing leaks under resolver v2.
      - run: cargo build -p verity-verifier-wasm --target wasm32-unknown-unknown
      # The core must also build without `attest`, since that is what makes the target reachable.
      - run: cargo build -p verity-verifier --no-default-features

  connect-alone:
    name: the verified transport, on a trimmed graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `connect` without `fetch`, which is the configuration an embedder who wants a verified
      # transport and no IPFS retrieval actually gets — and which nothing else here compiles.
      #
      # What it catches: `connect` acquiring a dependency on `fetch`. The two both use `ureq`, and
      # `fetch` additionally turns on `ureq/rustls` → `rustls/ring`. So a `connect` that leaned on a
      # feature `fetch` happens to enable would build under `--all-features` and CI would be silent.
      #
      # **What it does not yet prove, stated so nobody reads more into it:** this is still not a
      # single-provider graph. `connect` implies `attest` implies `dcap-qvl` with its default
      # `report` feature, which pulls reqwest and therefore `rustls/aws_lc_rs` — so both providers
      # are compiled here too, exactly as under `--all-features`. That is the recorded `dcap-qvl`
      # finding, and when it is fixed this leg becomes the ring-only build as well. Until then,
      # `connect/tls.rs` never calls the bare `ClientConfig::builder()` for the reason its own unit
      # test pins: with both providers on, it panics.
      - run: cargo build -p verity-verifier --no-default-features --features connect
      - run: cargo test -p verity-verifier --no-default-features --features connect --lib

  no-dangerous-attestation:
    name: TCB enforcement is not overridable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ADR 0014: TCB status enforcement is mandatory and not configurable. dcap-qvl ships both a
      # `danger-allow-tcb-override` feature and a `dangerous_verify_with_tcb_override` function.
      # A flag that turns a security check off is the flag someone eventually leaves off, so their
      # absence is asserted rather than assumed.
      - name: no danger-allow-tcb-override feature
        run: |
          if cargo tree -e features --all-features | grep -q "danger-allow-tcb-override"; then
            echo "::error::danger-allow-tcb-override is enabled; ADR 0014 forbids it"; exit 1
          fi
      - name: no dangerous_verify_with_tcb_override call
        run: |
          if grep -rn "dangerous_verify_with_tcb_override" crates/ 2>/dev/null; then
            echo "::error::TCB override API is called; ADR 0014 forbids it"; exit 1
          fi

  supply-chain:
    name: audit · deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # This repo does not commit Cargo.lock -- it is a library, and the handbook says not to.
      # cargo-audit needs one, so it is generated here rather than tracked.
      - name: generate lockfile
        run: cargo generate-lockfile
      # Run the binary directly rather than via rustsec/audit-check: the action does not read
      # .cargo/audit.toml, and the documented RUSTSEC-2023-0071 exception lives there. An audit that
      # ignored our reasoning would either fail always or need the exception duplicated.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
